{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    
    <div class="mb-8 flex items-center gap-4">
        <a href="{{ url_for('main.index') }}" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-600 hover:bg-green-50 hover:text-green-600 hover:border-green-200 transition shadow-sm">
            ←
        </a>
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Meu Perfil</h1>
            <p class="text-gray-500">Gerencie suas informações pessoais</p>
        </div>
    </div>

    <div class="bg-white rounded-3xl p-8 shadow-xl border border-gray-100">
        <div class="flex flex-col md:flex-row gap-8 items-start">
            
            <div class="w-full md:w-auto flex flex-col items-center gap-4">
                <div class="w-32 h-32 rounded-full bg-green-50 border-4 border-white ring-2 ring-green-100 flex items-center justify-center text-5xl shadow-sm text-green-600 font-bold">
                    {{ current_user.name[0].upper() }}
                </div>
                <button class="text-sm text-green-600 font-bold hover:text-green-800 hover:underline">
                    Alterar Foto
                </button>
            </div>

            <form class="flex-grow w-full space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider ml-1">Nome Completo</label>
                        <input type="text" value="{{ current_user.name }}" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-900 font-medium focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100 transition" disabled>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider ml-1">Função / Cargo</label>
                        <div class="relative">
                            <input type="text" value="{{ current_user.role|upper }}" class="w-full px-4 py-3 rounded-xl bg-green-50 border border-green-100 text-green-700 font-bold" disabled>
                            <span class="absolute right-4 top-3.5 text-lg">🏷️</span>
                        </div>
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider ml-1">Email Corporativo</label>
                        <input type="email" value="{{ current_user.email }}" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-900 focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100 transition" disabled>
                    </div>
                    
                    <div class="space-y-2 md:col-span-2">
                        <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider ml-1">Empresa / Fazenda</label>
                        <input type="text" placeholder="Adicione o nome da sua empresa" class="w-full px-4 py-3 rounded-xl bg-white border border-gray-300 text-gray-900 focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100 transition shadow-sm">
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-100 flex justify-end gap-3">
                    <a href="{{ url_for('main.index') }}" class="px-6 py-3 rounded-xl text-gray-500 hover:bg-gray-100 font-bold transition">
                        Cancelar
                    </a>
                    <button type="button" onclick="alert('Funcionalidade de salvar perfil simulada!')" class="px-8 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white font-bold shadow-lg shadow-green-600/20 transition transform hover:-translate-y-1">
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
