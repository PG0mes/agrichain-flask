{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden mt-10 border border-gray-200">
    <div class="bg-green-600 px-6 py-4">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <span>📝</span> Criar Conta
        </h2>
    </div>
    
    <div class="p-6">
        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nome Completo</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:border-green-500 focus:outline-none" 
                       name="name" type="text" placeholder="João Silva" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:border-green-500 focus:outline-none" 
                       name="email" type="email" placeholder="seu@email.com" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Tipo de Usuário</label>
                <select class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:border-green-500 focus:outline-none bg-white" name="role">
                    <option value="producer">🌾 Produtor</option>
                    <option value="distributor">🚛 Distribuidor</option>
                    <option value="retailer">🏪 Varejista</option>
                    <option value="consumer">👤 Consumidor</option>
                </select>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:border-green-500 focus:outline-none" 
                       name="password" type="password" placeholder="Mínimo 6 caracteres" required>
            </div>
            
            <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded w-full transition" type="submit">
                Criar Conta
            </button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            Já tem conta? <a href="{{ url_for('auth.login') }}" class="text-green-600 hover:font-bold">Faça login</a>
        </p>
    </div>
</div>
{% endblock %}
