{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-md mt-10 border border-gray-200">
    <div class="bg-green-600 px-6 py-4">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <span>🔐</span> Entrar na Conta
        </h2>
    </div>
    
    <div class="p-6">
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-green-500" 
                       id="email" name="email" type="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    Senha
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline focus:border-green-500" 
                       id="password" name="password" type="password" placeholder="********" required>
            </div>
            
            <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none focus:shadow-outline transition" type="submit">
                Entrar
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm text-gray-600">
            Não tem uma conta? <a href="{{ url_for('auth.register') }}" class="text-green-600 hover:font-bold">Registre-se aqui</a>
        </p>
    </div>
</div>
{% endblock %}
