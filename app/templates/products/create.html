{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden mt-6 border border-gray-200">
    <div class="bg-green-600 px-6 py-4 flex justify-between items-center">
        <h2 class="text-xl font-bold text-white">📝 Registrar Novo Produto</h2>
        <a href="{{ url_for('main.index') }}" class="text-green-100 hover:text-white text-sm">Voltar</a>
    </div>
    
    <div class="p-8">
        <form action="{{ url_for('products.create') }}" method="POST">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nome do Produto</label>
                    <input type="text" name="name" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="Ex: Tomate Orgânico" required>
                </div>
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Categoria</label>
                    <select name="category" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-green-500 bg-white">
                        <option value="Vegetables">Vegetais</option>
                        <option value="Fruits">Frutas</option>
                        <option value="Grains">Grãos</option>
                        <option value="Other">Outros</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Quantidade</label>
                    <input type="number" step="0.01" name="quantity" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-green-500" placeholder="0.00" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Unidade</label>
                    <select name="unit" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-green-500 bg-white">
                        <option value="kg">Quilograma (kg)</option>
                        <option value="ton">Tonelada (ton)</option>
                        <option value="unid">Unidade</option>
                        <option value="litros">Litros</option>
                    </select>
                </div>

                <div class="col-span-1 md:col-span-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Data da Colheita</label>
                    <input type="date" name="harvest_date" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-green-500" required>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg">
                Salvar Produto na Blockchain (Simulado)
            </button>
        </form>
    </div>
</div>
{% endblock %}
